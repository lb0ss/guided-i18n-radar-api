# How a reply should look per place. Code checks format, length, links and hashtags; the evaluator
# checks the rest. "own_post" channels are replies under your own post (no need to say you built it).
reddit-reply:
  format: markdown       # pasted into Reddit's Markdown editor
  max_chars: 500
  max_links: 1
  guide: >-
    A Reddit comment reply, pasted into Reddit's Markdown editor. 2 to 4 sentences; answer the person's
    point or question first. Separate paragraphs with a blank line (a single line break is lost);
    write a link as [text](url) and code as `code`. No headings, no bold, no list unless it really helps.
reddit-post:
  format: markdown
  max_chars: 6000
  max_links: 4
  guide: "A Reddit post. Markdown is fine (the post editor is in Markdown mode). Story first, technical details, honest limits."
github-comment:
  format: markdown
  max_chars: 1200
  max_links: 1
  guide: "A comment on someone's GitHub issue. Help with their actual problem first; code blocks welcome; no sales tone."
devto-comment:
  format: markdown
  max_chars: 800
  max_links: 1
  guide: "A comment on a dev.to article. Engage with what the author wrote first; short."
hn-comment:
  format: plain
  max_chars: 700
  max_links: 1
  guide: "A Hacker News comment. Plain, technical, understated; no marketing words at all."
so-answer:
  format: markdown
  max_chars: 2500
  max_links: 1
  guide: "A Stack Overflow answer. Solve the question fully with code first; a tool may be mentioned only as an option, with the disclosure."
x-post:
  format: plain
  max_chars: 280
  max_links: 0
  max_hashtags: 1
  guide: "One post on X, at most 280 characters. No links (they go in the first reply), at most one hashtag."
